name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    name: Build DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DMG
        run: ./gradlew clean :composeApp:packageDmg --no-configuration-cache --no-build-cache

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: installer-dmg
          path: composeApp/build/compose/binaries/**/*.dmg
          if-no-files-found: error

  android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RELEASE_KEYSTORE_FILE"

      - name: Test
        run: ./gradlew :composeApp:allTests --no-configuration-cache --no-build-cache

      - name: Build signed APK & AAB
        if: env.HAS_SIGNING == 'true'
        run: ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease --no-configuration-cache --no-build-cache

      - name: Build debug APK
        if: env.HAS_SIGNING != 'true'
        run: ./gradlew :composeApp:assembleDebug --no-configuration-cache --no-build-cache

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  release:
    name: Create Release
    needs:
      - desktop
      - android
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List Artifacts
        run: find artifacts -type f

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
