name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    name: Build DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DMG
        run: ./gradlew clean :composeApp:packageDmg --no-configuration-cache --no-build-cache

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: installer-dmg
          path: composeApp/build/compose/binaries/**/*.dmg
          if-no-files-found: error

  android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Seed signing keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "No signing keystore configured; refusing to publish an unstably signed APK." >&2
            exit 1
          fi
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p "$HOME/.android"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$HOME/.android/debug.keystore"
          fi

      - name: Verify debug keystore
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "No debug keystore seeded; skipping verification."
            exit 0
          fi
          FINGERPRINT=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ' ')
          echo "Debug keystore SHA-256: $FINGERPRINT"
          if [ "$FINGERPRINT" != "FA:BB:6A:8E:57:47:2B:B6:54:01:7D:6C:2F:C5:20:C2:D1:06:A3:0A:88:71:33:BC:35:F0:4C:69:AE:0C:A8:0F" ]; then
            echo "KEYSTORE_BASE64 does not match the local debug keystore." >&2
            exit 1
          fi

      - name: Decode keystore
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RELEASE_KEYSTORE_FILE"

      - name: Test
        run: ./gradlew :composeApp:allTests --no-configuration-cache --no-build-cache

      - name: Build signed APK & AAB
        if: env.HAS_SIGNING == 'true'
        run: ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease --no-configuration-cache --no-build-cache

      - name: Build debug APK
        if: env.HAS_SIGNING != 'true'
        run: ./gradlew :composeApp:assembleDebug --no-configuration-cache --no-build-cache

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  release:
    name: Create Release
    needs:
      - desktop
      - android
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List Artifacts
        run: find artifacts -type f

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
