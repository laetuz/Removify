name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test & build APK
        run: ./gradlew :composeApp:allTests :composeApp:assembleDebug --no-configuration-cache --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: removify-android-debug
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          if-no-files-found: error

  desktop:
    name: Desktop DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DMG
        run: ./gradlew :composeApp:packageDmg --no-configuration-cache --no-build-cache

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: removify-desktop-dmg
          path: composeApp/build/compose/binaries/**/*.dmg
          if-no-files-found: error
