name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Seed signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p "$HOME/.android"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo "KEYSTORE_BASE64 is not set; this run will use a throwaway debug key."
          fi

      - name: Verify debug keystore
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "No debug keystore seeded; skipping verification."
            exit 0
          fi
          FINGERPRINT=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ' ')
          echo "Debug keystore SHA-256: $FINGERPRINT"
          if [ "$FINGERPRINT" != "FA:BB:6A:8E:57:47:2B:B6:54:01:7D:6C:2F:C5:20:C2:D1:06:A3:0A:88:71:33:BC:35:F0:4C:69:AE:0C:A8:0F" ]; then
            echo "KEYSTORE_BASE64 does not match the local debug keystore." >&2
            exit 1
          fi

      - name: Test & build APK
        run: ./gradlew :composeApp:allTests :composeApp:assembleDebug --no-configuration-cache --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: removify-android-debug
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          if-no-files-found: error

  desktop:
    name: Desktop DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DMG
        run: ./gradlew :composeApp:packageDmg --no-configuration-cache --no-build-cache

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: removify-desktop-dmg
          path: composeApp/build/compose/binaries/**/*.dmg
          if-no-files-found: error
